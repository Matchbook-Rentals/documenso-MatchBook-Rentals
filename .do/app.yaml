name: documenso-matchbook
services:
- name: web
  source_dir: /
  github:
    repo: Matchbook-Rentals/documenso-MatchBook-Rentals
    branch: matchbook-modifications
    deploy_on_push: true
  dockerfile_path: Dockerfile
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 3000
  routes:
  - path: /
  envs:
  # Database (auto-generated by DO managed database)
  - key: NEXT_PRIVATE_DATABASE_URL
    scope: RUN_TIME
    type: SECRET
  - key: NEXT_PRIVATE_DIRECT_DATABASE_URL  
    scope: RUN_TIME
    type: SECRET
  
  # Auth
  - key: NEXTAUTH_SECRET
    scope: RUN_TIME
    type: SECRET
  - key: NEXTAUTH_URL
    scope: RUN_TIME
    value: ${APP_URL}
    
  # URLs  
  - key: NEXT_PUBLIC_WEBAPP_URL
    scope: RUN_TIME
    value: ${APP_URL}
  - key: NEXT_PRIVATE_INTERNAL_WEBAPP_URL
    scope: RUN_TIME
    value: http://localhost:3000
    
  # Signing (your certificates)
  - key: NEXT_PRIVATE_SIGNING_TRANSPORT
    scope: RUN_TIME
    value: local
  - key: NEXT_PRIVATE_SIGNING_PASSPHRASE
    scope: RUN_TIME
    value: matchbook-secure-2024
  - key: NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH
    scope: RUN_TIME
    value: /opt/documenso/cert.p12
    
  # SMTP (disabled)
  - key: NEXT_PRIVATE_SMTP_TRANSPORT
    scope: RUN_TIME
    value: smtp-auth
  - key: NEXT_PRIVATE_SMTP_HOST
    scope: RUN_TIME
    value: smtp.gmail.com
  - key: NEXT_PRIVATE_SMTP_PORT
    scope: RUN_TIME
    value: "587"
  - key: NEXT_PRIVATE_SMTP_USERNAME
    scope: RUN_TIME
    value: ""
  - key: NEXT_PRIVATE_SMTP_PASSWORD
    scope: RUN_TIME
    value: ""
  - key: NEXT_PRIVATE_SMTP_FROM_NAME
    scope: RUN_TIME
    value: "MatchBook Rentals"
  - key: NEXT_PRIVATE_SMTP_FROM_ADDRESS
    scope: RUN_TIME
    value: "noreply@matchbookrentals.com"
    
  # Storage
  - key: NEXT_PUBLIC_UPLOAD_TRANSPORT
    scope: RUN_TIME
    value: database
    
  # Encryption
  - key: NEXT_PRIVATE_ENCRYPTION_KEY
    scope: RUN_TIME
    type: SECRET
  - key: NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY
    scope: RUN_TIME
    type: SECRET

databases:
- name: documenso-db
  engine: PG
  version: "15"
  size: db-s-dev-database